#Enable actuator endpoint
management:
  endpoints:
    web:
      exposure:
        include: "*"
#Datasource configuration
spring:
    datasource:
       # url: jdbc:mysql://localhost:3306/your_database_name
        url: jdbc:h2:mem:prodmphasisdb
        username: SA
        password:
        driver-class-name: org.h2.Driver

    jpa:
       properties:
          hibernate:
                show_sql: true
                format_sql: true

    h2:
       console:
          enabled: true
          path: /spring-boot-h2-console
